name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:api
      - run: npm run check:package
      - run: npm run check:ssr

      # Trusted publishing: npm exchanges this workflow's OIDC token for a short-lived
      # publish credential. No NPM_TOKEN secret is involved. The trusted publisher on
      # npmjs.com must name this repository and this workflow file (`publish.yml`).
      - name: Publish with provenance
        run: npm publish --provenance --access public
